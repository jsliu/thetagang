# thetagang-nt in Docker. It serves its metrics on the host's 127.0.0.1:9464; dashboards and
# Telegram alerts are the separate monitoring repo (../../monitoring: ./run.sh up), which scrapes them
# (Grafana: http://localhost:3000, folder "thetagang").
# The bot talks to TWS on the host (host.docker.internal; TWS: Configure > API > Settings must
# allow the connection). `docker compose up -d --build`, then `docker compose logs -f thetagang-nt`.
services:
  thetagang-nt:
    build: .
    image: thetagang-nt:1.231.0
    # THETAGANG_CONFIG: path relative to the repo root (default: your local config)
    command: ["python", "-m", "thetagang_nt.node", "-c", "${THETAGANG_CONFIG:-thetagang.nt.local.toml}"]
    environment:
      IB_HOST: host.docker.internal
    volumes:
      - ..:/app:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:9464:9464"]   # /metrics, scraped by the monitoring repo's Prometheus
    init: true                        # tini as PID 1: signals and crash exits behave
    stop_grace_period: 30s            # let the node disconnect cleanly
    restart: unless-stopped
