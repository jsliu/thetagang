# ThetaGang options discretionary strategy: sample config (schema v2).
#
# Each run it:
#   - manages every USD stock and option symbol you hold (no symbol list needed),
#   - prints SPX beta-weighted greeks, stress P&L and delta by symbol
#     (see PORTFOLIO_RISK_GUIDE.md),
#   - opens the trades listed in [[strategies.discretionary.trades]], sized so the
#     account's SPX delta goes to 0. Existing positions are never resized,
#   - rolls or closes short options per roll_when: standalone shorts alone,
#     credit verticals as whole spreads; calendar/diagonal legs are left alone,
#     except short calls fully covered by your shares, which roll on their own,
#   - shows the long VIX calls you hold and sells them once VIX passes
#     strategies.vix_call_hedge.close_hedges_when_vix_exceeds.
#
# Copy this file to thetagang.<name>.local.toml (ignored by git) for your real
# settings, e.g.:
#   thetagang --config thetagang.local.toml --dry-run
#
# The wheel strategy uses thetagang.toml instead. Any default values in this
# config do not constitute a recommendation or endorsement, or any claims about
# returns or performance.

[meta]
schema_version = 2

[run]
# discretionary runs the roll, close and post_discretionary stages. It can't be
# combined with wheel or regime_rebalance, which size positions by weight.
strategies = ["discretionary"]

[runtime.account]
# The account number to manage
number = "DU1234567"

# Cancel open orders for managed symbols at startup
cancel_orders = true

# Market data type (https://interactivebrokers.github.io/tws-api/market_data_type.html)
# 1 = live: returns no prices while the market is closed, so runs fail with
#     "RequiredFieldValidationError ... MARKET_PRICE".
# 2 = frozen: live while open, last recorded values (e.g. Friday's close)
#     while closed. Use this to run at any time.
market_data_type = 2

[runtime.option_chains]
# How many expirations and strikes to scan when looking for a contract to roll into
expirations = 4
strikes = 15

[runtime.exchange_hours]
# What to do when the exchange is closed: "exit", "wait" or "continue"
exchange = "XNYS"
action_when_closed = "exit"
max_wait_until_open = 3600
delay_after_open = 1800
delay_before_close = 1800

[runtime.orders]
exchange = "SMART"
price_update_delay = [30, 60]
minimum_credit = 0.05

  [runtime.orders.algo]
  strategy = "Adaptive"
  params = [["adaptivePriority", "Patient"]]

[runtime.ib_async]
logfile = "ib_async.log"
# Seconds to wait for IB data before giving up on a field
api_response_wait_time = 60

[runtime.ibc]
# Only used when thetagang starts TWS/Gateway itself (not with --without-ibc)
gateway = true
ibcPath = "/opt/ibc"
tradingMode = "paper"
RaiseRequestErrors = false
password = "demo"
userid = "demo"
ibcIni = "/etc/thetagang/config.ini"
javaPath = "/opt/java/openjdk/bin"

[runtime.watchdog]
appStartupTime = 30
appTimeout = 20
clientId = 1
connectTimeout = 2
host = "127.0.0.1"
port = 7497
probeTimeout = 4
readonly = false
retryDelay = 2

  [runtime.watchdog.probeContract]
  currency = "USD"
  exchange = "SMART"
  secType = "STK"
  symbol = "SPY"

# Roll settings live under strategies.wheel.defaults (shared with the wheel).

[strategies.wheel.defaults.target]
# What a roll moves into (the new short leg; a spread keeps its width)
dte = 7
max_dte = 180
delta = 0.3
# Ignored when IB sends no open interest (e.g. outside market hours)
minimum_open_interest = 1000

[strategies.wheel.defaults.roll_when]
# Roll a short option (or credit vertical) when either is true:
#   - days to expiry <= dte and P&L >= min_pnl
#   - P&L >= pnl (and days to expiry <= max_dte, if set)
# P&L is the share of the premium (net credit, for spreads) already captured.
pnl = 0.9
dte = 3
min_pnl = 0.0
# max_dte = 180

# Close instead of rolling when P&L > close_at_pnl (checked after the roll rules)
close_at_pnl = 0.9

# If no contract to roll into is found, close the position instead when it is
# profitable and within max_dte (requires max_dte above)
close_if_unable_to_roll = true

  [strategies.wheel.defaults.roll_when.calls]
  # Roll in-the-money calls; always_when_itm rolls them regardless of P&L
  itm = true
  always_when_itm = false
  # Only roll for a net credit of at least runtime.orders.minimum_credit
  credit_only = false
  # Covered calls (calls on shares you own): never roll to a lower strike
  maintain_high_water_mark = false

  [strategies.wheel.defaults.roll_when.puts]
  itm = true
  always_when_itm = false
  credit_only = false

[strategies.discretionary]
# No new trades while |SPX delta| is at most this (SPX units: 1 = $1 per $1 SPX
# move, i.e. one SPX share's worth of exposure).
delta_band = 1.0

# Trades to open. Each run the bot prices them, then picks how many contracts
# (whole spreads for verticals) bring the account's SPX delta to 0, given what you
# already hold. The needed delta is split across trades by weight; a trade that
# would push delta the wrong way gets 0. Orders are limit orders at mid (verticals:
# one combo order), tagged so a rerun cancels unfilled ones before re-planning.
#
# structure: long_call, short_call, long_put, short_put,
#            put_credit_spread, call_credit_spread, put_debit_spread, call_debit_spread
# delta:     target |delta| of the main leg (the short leg of a credit spread,
#            the long leg of a debit spread)
# width:     strike distance to the second leg (verticals only)
#
#   [[strategies.discretionary.trades]]
#   symbol = "SPY"
#   structure = "long_put"
#   delta = 0.3
#   dte = 45
#   weight = 1.0
#   max_contracts = 5
#
#   [[strategies.discretionary.trades]]
#   symbol = "QQQ"
#   structure = "call_credit_spread"
#   delta = 0.25
#   dte = 30
#   width = 5
#   weight = 2.0

[strategies.vix_call_hedge]
# Long VIX calls you already hold: sell them all once VIX rises above this level
# (take profit on the hedge in a spike). The bot never buys VIX calls.
# Leave unset to never close them automatically.
close_hedges_when_vix_exceeds = 30.0

[portfolio.symbols]
# Optional per-symbol overrides. Every held symbol is managed whether or not it
# is listed here, and no weights are needed. Example:
#
#   [portfolio.symbols.TQQQ]
#   delta = 0.3          # roll target delta for puts and calls
#   max_dte = 45
#   no_trading = true    # show it, but never roll or close it
#     [portfolio.symbols.TQQQ.puts]
#     strike_limit = 100.0   # never roll a put above this strike
#     [portfolio.symbols.TQQQ.calls]
#     strike_limit = 120.0   # never roll a call below this strike
#     maintain_high_water_mark = true
