# thetagang on NautilusTrader: `thetagang-nt -c thetagang.nt.toml`
# Sample config (paper trading, dry run). Copy to thetagang.nt.local.toml (git-ignored)
# for your own settings.
# Run in Docker (Python 3.12 image; the trade env is 3.11):
#   cd deploy && docker compose up -d --build   # the bot
#   THETAGANG_CONFIG=thetagang.nt.toml docker compose up -d   # another config
#   docker compose logs -f thetagang-nt
# In Docker the bot reaches TWS at host.docker.internal (IB_HOST overrides ib.host).
# Metrics: http://localhost:9464/metrics. Dashboard and Telegram alerts: the separate monitoring
# repo, ../monitoring (http://localhost:3000, folder "thetagang").

[node]
trader_id = "THETAGANG-001"
log_level = "INFO"
# log_directory = "logs"
# redis_host = "localhost"    # persist the Nautilus cache in Redis
position_check_secs = 60      # pick up trades made in TWS within a minute (0: only at startup)

[ib]
host = "127.0.0.1"
port = 7497                   # TWS paper 7497, live 7496; IB Gateway paper 4002, live 4001
client_id = 11
# account_id = "DU0000000"    # or set TWS_ACCOUNT
market_data_type = "REALTIME" # DELAYED_FROZEN shows last prices when markets are shut

# Run IB Gateway in docker instead of a local TWS (Nautilus starts it):
# [ib.gateway]
# username = "..."
# password = "..."
# trading_mode = "paper"
# read_only_api = false

[monitor]                     # the dashboard process (read-only, never trades)
interval_secs = 60            # recompute positions, greeks and risk every 60 s
metrics_port = 9464           # Prometheus scrapes the dashboard data here
stress_moves = [-0.10, -0.05, -0.01, 0.01, 0.05, 0.10]  # SPX moves in the Stress P&L table

# The strategy's rules. The dashboard (--role monitor, the docker default) only reads
# them, for the Options tables' actions, the trade plan and the VIX hedge row; it never
# trades. Orders are sent only by the trading process (--role trade or all).
[strategy.trading]            # when and how the trading process acts
dry_run = true                # log orders, never send them
interval_secs = 300           # run the strategy every 5 min
market_hours_only = true      # do nothing while the US market is closed
# The trade plan resizes held positions toward the dashboard's "SPX delta = 0
# targets" (shares, one option, or a whole vertical per symbol; never adds short
# options). "auto": place it when off neutral; "manual": only show it, and trade
# with `thetagang-nt pretrade` (deploy/pretrade.sh)
approve_trades = "auto"
proposal_max_age_secs = 300   # answering pretrade later than this sends nothing
reprice_after_secs = 60       # move unfilled orders halfway to mid, once
pretrade_metrics_port = 9466  # the Pre-trade dashboard, while pretrade asks y/N

# SPX delta neutral (no new trades) while |beta delta $| <= the band:
[strategy.delta_band]
theta_days = 2.0              # a 1% SPX day may cost at most this many days of theta,
nav_pct = 0.10                # capped at this share of net liq

[strategy.chain]              # how a contract is picked by delta from the option chain
strikes = 15                  # strikes quoted per expiry
expirations = 2               # expiries searched (the nearest ones in the DTE window)
minimum_credit = 0.0          # least price per share of an option the bot picks (the new
                              # leg of a roll, the VIX call); with credit_only, the least
                              # net credit a roll must collect

# ---- Standalone short calls/puts and credit spreads -------------------------
[strategy.credit.roll_target] # what a roll moves into (a credit spread: its new short
                              # leg; the long leg keeps the width). Per-symbol delta /
                              # max_dte in [strategy.symbols.X] override it.
dte = 7                       # new expiry at least 7 days out
max_dte = 60                  # ...and at most 60 days out
delta = 0.3                   # new short strike nearest |delta| 0.30

# Roll if P&L >= pnl, or if DTE <= dte and P&L >= min_pnl. P&L = share of the
# premium captured (0.9 = 90%).
[strategy.credit.roll_when]
pnl = 0.9                     # roll at 90% captured, whatever the DTE
dte = 10                      # roll once 10 days or fewer are left...
min_pnl = 0.7                 # ...if at least 70% is captured
# max_dte = 180               # never roll options further out than this
close_at_pnl = 0.9            # close (not roll) above 90% captured
close_if_unable_to_roll = true  # close a winner whose roll failed; needs max_dte
                                # (commented out above, so off for now)

  [strategy.credit.roll_when.calls]  # same three switches for .puts below
  itm = true                  # in-the-money calls may roll (false: never roll ITM)
  always_when_itm = false     # true: roll as soon as ITM, whatever the P&L
  credit_only = false         # true: roll only for a net credit >= minimum_credit

  [strategy.credit.roll_when.puts]
  itm = true
  always_when_itm = false
  credit_only = false

# ---- Debit spreads and standalone long calls/puts -----------------------------
[strategy.debit]
take_profit = 0.8             # close a debit spread at 80% of its max profit
                              # (width - debit paid)
long_take_profit_gain = 1.0   # close a long call/put once worth (1 + this) x the
                              # premium paid: 1.0 = at double
max_roll_debit = 0.5          # a roll may cost at most 0.5 x the spread width (a spread)
                              # or 0.5 x the old option's value (a long), per share;
                              # dearer: no roll

[strategy.debit.roll_when]    # roll once DTE <= dte or |delta| >= delta, unless
                              # take-profit closed it first
dte = 10
delta = 0.8                   # also roll once the long leg's |delta| reaches this
                              # (deep in the money); 0: off
# max_dte = 180
close_if_unable_to_roll = true  # close a winner whose roll failed; needs max_dte
                                # (commented out above, so off for now)

[strategy.debit.roll_target]  # what a roll moves into: the new long option (a
                              # spread's short leg keeps the width)
dte = 7                       # new expiry at least 7 days out
max_dte = 60                  # ...and at most 60 days out
delta = 0.3                   # new long strike nearest |delta| 0.30

# ---- Butterflies, straddles/strangles, calendars/diagonals ----------------------
# The Structures table recommends what to do; with trade = true the bot also places it
# (close, close half, adjust a leg; never "roll whole", which stays yours). dry_run applies.
[strategy.butterfly]
trade = false                 # true: the bot places these recommendations
take_profit = 0.5             # close at 50% of the max profit
partial_take_profit = 0.25    # close half (2+ held) at 25% of the max profit
close_dte = 7                 # close with 7 days or fewer left (the body's gamma)

[strategy.straddle]           # long straddles and strangles
trade = false
take_profit_gain = 0.5        # close at P&L >= 50% of the debit
partial_take_profit_gain = 0.25  # close half (2+ held) at +25%
leg_delta = 0.7               # a winning leg at |delta| >= 0.7: close that leg
roll_dte = 21                 # roll the whole position out with 21 days left

[strategy.calendar]           # calendars and diagonals (long the later expiry)
trade = false
take_profit = 0.25            # close at P&L >= 25% of the debit
short_roll_dte = 5            # roll the short leg out with 5 days or fewer left
close_dte = 10                # close once the long leg has 10 days or fewer left

[strategy.vix_call_hedge]     # long VIX calls as a crash hedge, sized by allocation
enabled = false
delta = 0.30                  # buy the call nearest 0.30 delta
target_dte = 30               # about 30 days out
close_hedges_when_vix_exceeds = 30.0  # sell every hedge call once VIX is above 30
ignore_dte = 0                # calls with DTE <= this don't count as held hedges

# first match wins: lower_bound <= VIXMO < upper_bound; weight x net liq in VIX calls
[[strategy.vix_call_hedge.allocation]]
upper_bound = 15.0
weight = 0.0

[[strategy.vix_call_hedge.allocation]]
lower_bound = 15.0
upper_bound = 30.0
weight = 0.01

[[strategy.vix_call_hedge.allocation]]
lower_bound = 30.0
upper_bound = 50.0
weight = 0.005

[[strategy.vix_call_hedge.allocation]]
lower_bound = 50.0
weight = 0.0

# Option legs you hold as one position, by the dashboard's contract labels. Checked
# before automatic grouping (butterflies, long straddles/strangles, verticals,
# calendars/diagonals); left to you and never resized by the trade plan:
# [[strategy.structures]]
# name = "AA iron fly"
# legs = ["AA 20261218 35P", "AA 20261218 40P", "AA 20261218 40C", "AA 20261218 45C"]

# Per-symbol overrides (every held symbol is managed):
# [strategy.symbols.TQQQ]
# no_trading = false              # true: never trade this symbol (shown, never managed)
# put_strike_limit = 100.0        # never roll a put above this strike
# call_strike_limit = 120.0       # never roll a call below this strike
# delta = 0.3                     # roll target delta for TQQQ (overrides credit.roll_target)
# max_dte = 250                   # roll target max DTE for TQQQ (overrides credit.roll_target)
# ignore_missing_greeks = false   # true: its options with no quote count as zero
#                                  # delta when sizing the trade plan, instead of blocking it

# Ideas for `thetagang-nt pretrade` (deploy/pretrade.sh) to compare: each candidate's
# trades are sized together to bring SPX delta to 0 (structure: long_call,
# short_call, long_put, short_put, put_credit_spread, call_credit_spread,
# put_debit_spread, call_debit_spread; spreads need width),
# each candidate on its own; pretrade shows them side by side and sends the one you
# pick. Without candidates, pretrade proposes the strategy's own trade plan.
# The trading strategy also compares them every refresh_mins (market hours), so the
# Pre-trade dashboard always shows them:
# [pretrade]
# refresh_mins = 15   # 0: only when you run pretrade
# [[pretrade.candidates]]
# name = "AA put spread"          # shown on the Pre-trade dashboard and in the prompt
# [[pretrade.candidates.trades]]
# symbol = "AA"
# structure = "put_debit_spread"  # long the put nearest delta, short one width lower
# width = 5.0                     # strikes $5 apart
# delta = 0.6                     # long leg nearest |delta| 0.60
# dte = 60                        # expiry about 60 days out
# weight = 1.0                    # share of the candidate's delta this trade carries
# max_contracts = 10              # never more than 10, whatever the sizing says

# ---- Portfolio Manager (decision support, vault PM Knowledge Base) ------------
# The defaults are shown; uncomment to change. Every threshold is a hypothesis
# (vault assumptions_register ID in brackets).
# [pm]
# decide = true                 # its review signals replace the bot's roll/close
#                               # orders (they only report); false: the bot's rules trade
# journal = true                # write the journal (Postgres at $JOURNAL_DSN)
# max_loss = 2000.0             # risk budget, $, for every strategy: P0 CLOSE review when
#                               # its worst case exceeds it; [[pm.strategies]] max_loss overrides
# profit_levels = [0.5, 1.0, 1.5]  # [T1] debit: review at +50 / +100 / +150% of the debit
# spread_max_profit = 0.8       # [T1] defined-risk debit: review at 80% of max profit
# credit_levels = [0.5, 0.75]   # [T2] credit: review at 50 / 75% captured
# delta_review = 0.8            # [T4] a single long option at |delta| above this
# # delta_drift = 0.5           # [T5] net delta moved by this share of entry gross delta
# gt_review = 1.0               # [T6] long convexity: GT_h below this (decay beats gamma)
# gt_horizon = 5                # [T6] trading days
# remaining_reward_risk = 0.25  # [T8] remaining reward / risk below this
# near_expiry_days = 7          # a short leg this close to expiry...
# near_money = 0.02             # ...and within 2% of its strike
# stale_secs = 300              # [T9] a quote older than this is stale
# wide_spread = 0.25            # [T9] P2 "wide spread" (a real cost, not bad data) when
#                               # (ask - bid) / mid is above this...
# wide_spread_min = 0.05        # [T9] ...and ask - bid is above this, $ per share
# dte_windows = [[90, 28], [180, 60], [365, 120], [730, 270]]  # [T3] original life ->
#                               # review at days left (interpolated; LEAPS keep 270)
# gamma_tolerance = 0.01        # [T7] |net gamma| below this counts as zero (shares per $1)
# theta_tolerance = 0.01        # [T7] |net theta| below this counts as zero ($ per day)
# grid_moves = [-0.05, -0.02, 0.0, 0.02, 0.05]  # [M1] scenario grid price moves
#                               # (and the gamma sign check)
# iv_shifts = [-10.0, -5.0, 0.0, 5.0, 10.0]  # [M1] scenario grid IV shifts, points
# vix_moves = [-0.2, -0.1, 0.0, 0.15, 0.3]  # [M11] VIX grid: matching-future moves
# vix_iv_shifts = [-20.0, -10.0, 0.0, 10.0, 20.0]  # [M11] VIX grid: IV shifts
# Phase 2 forward value (vault expected_pnl, risk_metrics, roll_rules); the
# vault leaves these open, so the values are starting points:
# utility_horizon = 5           # trading days for E[P&L], Expected Shortfall, utility
# es_alpha = 0.10               # [M7] Expected Shortfall: the worst 10% of outcomes
# risk_aversion = 0.1           # [M7] lambda: utility cost per $ of Expected Shortfall
# capital_cost = 0.05           # [M7] kappa: yearly cost of the capital at risk
# commission = 0.65             # [M9] $ per contract to trade
# Roll candidates (vault roll_rules), reported, never orders. One strategy not on
# HOLD is scanned per monitor cycle, its candidates quoted a few at a time:
# roll_scan = true              # false: no scans, no extra market data lines
# roll_quote_lines = 12         # market data lines a scan may use at once (IB limits them)
# roll_rescan_mins = 30         # how often a strategy's candidates are refreshed
# roll_dte_multiples = [1.0, 1.5, 2.0]  # [M13] new front DTE, multiples of the original life
# roll_min_life = 30            # [M13] a shorter or unknown life counts as this
# roll_min_extension = 14       # [M13] days past the current front expiry, at least
# roll_strike_shifts = [-0.05, 0.0, 0.05]  # [M13] strike shifts, share of the underlying
# roll_strike_tolerance = 0.03  # [M13] the nearest listed strike must be within this
# vix_roll_dte = [30, 45, 60]   # [V1] long VIX: roll target DTEs
# roll_margin = 10.0            # [M7] a roll must beat HOLD by more than this, $
# The joint price and IV model, reported beside the IV-unchanged one. One underlying's
# two years of IB bars per monitor cycle, once a day:
# american_pricing = true       # equity and ETF options, with IB's dividends; false: European
# surface = true                # a small smile per held expiry, for sticky-delta model risk
# surface_strikes = [-0.1, -0.05, 0.0, 0.05, 0.1]  # [M14] smile strikes, moves from spot
# iv_model = true               # false: no IV history requests
# iv_window = 252               # [M8] trading days today's IV is ranked against
# iv_min_samples = 30           # [M8] fewer in today's third: use all of history
# iv_view_shrink = 0.5          # [M8] share of the expected IV change kept
# iv_term_days = 30             # [M3] a leg moves by sqrt(this / DTE) of an IV change
# realized_vol_days = 21        # [M6] daily returns behind the realised-vol forecast
# The settings above serve the Long Options Manager (strategies opened for a
# debit; credit_levels [T2] is superseded by S1). Strategies opened for a credit
# go to the Short Options Manager:
# capture_levels = [0.5, 0.7, 0.8, 0.9]  # [S1] credit captured: review / strong
#                               # consideration / default close / normally close
# short_dte_bands = [21, 14, 7] # [S2] front short leg DTE at or below: review /
#                               # prefer closing or adjust / generally prefer closing
# loss_multiples = [1.0, 2.0, 3.0]  # [S3] loss as a multiple of the credit
# assignment_days = 7           # [S4] an in-the-money short leg this close to expiry
# ex_dividend_days = 10         # [S4] an in-the-money short call this close to an ex-date,
#                               # its extrinsic value below the dividend (either manager)
# tested_moves = 1.0            # [S5] spot within this many moves of a short strike
# tested_horizon = 5            # [S5] trading days in a move (S x sigma_f x sqrt(h/252))
# Long VIX calls (vault vix_options_management) replace T1 and T3 with:
# vix_profit_levels = [0.10, 0.15, 0.20, 0.30]  # [V2] review at these gains on the
#                               # debit: review / evaluate early close / consider /
#                               # strong profit-taking consideration
# vix_loss_levels = [-0.25, -0.35]  # [V3] loss reviews (not stop-losses)
# vix_review_dte = 14           # [V7] review at this many days left, before the
#                               # last trading session (the vault leaves it to be set)
#
# Your inputs for one strategy, by its ID on the Portfolio Manager dashboard:
# [[pm.strategies]]
# id = "AA-debit-spread-1"
# thesis = "aluminium tariffs lift AA into earnings"
# invalidation_below = 35.0     # P0: thesis invalid if AA trades below
# target = 300.0                # profit target, $
# max_loss = 200.0              # risk budget, $: P0 when the worst case exceeds it
# thesis_valid = true
# assignment_intended = false   # short premium: true if expiry/assignment is the plan
#                               # (cash-secured put, covered call): no S4 review
